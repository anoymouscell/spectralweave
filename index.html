<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="anoymouscell">
  <meta name="description" content="SpectralWeave project page.">
  <title>SpectralWeave</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172338; background: #f7f9fc; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { width: min(800px, calc(100% - 48px)); padding: 80px 0; text-align: center; }
    .spectrum { height: 5px; width: 120px; margin: 0 auto 40px; border-radius: 8px; background: linear-gradient(90deg, #6d5ce7, #299fd6, #36bca4); }
    h1 { margin: 0 0 20px; font-size: clamp(2.4rem, 9vw, 5rem); letter-spacing: -.055em; font-weight: 650; }
    .author { color: #53637a; }
    .status { margin: 52px 0; color: #53637a; line-height: 1.7; }
    a { color: #374fc4; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #299fd6; outline-offset: 6px; }
    footer { margin-top: 90px; color: #6b7686; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="spectrum" aria-hidden="true"></div>
    <h1>SpectralWeave</h1>
    <p class="author">anoymouscell</p>
    <p class="status">Project materials will be added here.</p>
    <a href="https://github.com/anoymouscell/spectralweave">GitHub repository</a>
    <footer>SpectralWeave · anoymouscell</footer>
  </main>
</body>
</html>
